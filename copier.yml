_min_copier_version: "9.0.0"
_answers_file: .copier-answers.yml

_envops:
  block_start_string: "<%!"
  block_end_string: "!%>"
  variable_start_string: "<%="
  variable_end_string: "=%>"
  comment_start_string: "<%#"
  comment_end_string: "#%>"

_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - core
  - docs/checklists
  - .claude/worktrees
  - "**/.turbo"
  - "**/node_modules"
  - "**/dist"
  - .venv
  - .env
  - .npmrc
  - .npmrc.auth
  - .env.local
  - .env.*.local
  - <%!- if not (feature_mobile_expo or feature_mobile_react_native) or not include_maestro_tests -!%>apps/maestro<%!- endif -!%>
  - <%!- if not (feature_web_vite or feature_web_next) or not include_playwright_tests -!%>apps/playwright<%!- endif -!%>

project_name:
  type: str
  help: Project name
  default: my-project
  validator: >-
    <%!- set slug = project_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '') -!%>
    <%!- if not slug -!%>
    Project name must contain at least one letter or number.
    <%!- elif slug | length > 214 -!%>
    Project slug must not exceed 214 characters.
     <%!- endif -!%>

features_json:
  type: str
  help: Selected stack features as JSON
  default: '["web-vite", "api-nest"]'

feature_web_vite:
  type: bool
  default: true

feature_web_next:
  type: bool
  default: false

feature_api_nest:
  type: bool
  default: true

feature_api_express:
  type: bool
  default: false

feature_mobile_expo:
  type: bool
  default: false

feature_mobile_react_native:
  type: bool
  default: false

include_maestro_tests:
  type: bool
  default: true
  when: <%= feature_mobile_expo or feature_mobile_react_native =%>

include_playwright_tests:
  type: bool
  default: true
  when: <%= feature_web_vite or feature_web_next =%>

_message_after_copy: ""

_tasks:
  - node scripts/render-package-scope.mjs

_message_after_update: |
  Project "<%= project_name =%>" updated successfully.
  Review any conflicts, then run `just check`.

_migrations:
  - command: node scripts/dev-ports.mjs
